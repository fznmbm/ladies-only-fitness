<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b2a4e">
<title>No signal</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #faf5ef; color: #2b1f2e; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 360px; padding: 32px 24px; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-family: Georgia, serif; font-size: 28px; margin: 18px 0 8px; }
  p { color: #6b5a69; margin: 0 0 24px; }
  button { width: 100%; min-height: 52px; border: 0; border-radius: 999px; background: #5b2a4e;
           color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icon-192.png" alt="">
  <h1>No signal just now</h1>
  <p>The app needs an internet connection. Move closer to a window or turn on Wi-Fi, then try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
